services:
  su-store:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COOKIE_SECRET: ${COOKIE_SECRET}
    image: su-store:latest
    container_name: su-store
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      COOKIE_SECRET: ${COOKIE_SECRET}
      ORDER_API_BASE_URL: ${ORDER_API_BASE_URL:-}
      ORDER_API_TOKEN: ${ORDER_API_TOKEN:-}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      BYPASS_TOKEN: ${BYPASS_TOKEN:-}
      ALWAYS_OPEN: "${ALWAYS_OPEN:-0}"
      STAGING_HOST: "${STAGING_HOST:-store.sumfu.xyz}"
    volumes:
      - /home/park/SU-STORE/data/su-store:/app/data
      - /home/park/SU-STORE/data/next-image-cache:/app/.next/cache/images
    depends_on:
      order-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  order-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: su-order-api:latest
    container_name: su-order-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:10000"
    environment:
      ORDER_API_HOST: 0.0.0.0
      ORDER_API_PORT: 10000
      ORDER_API_DB_PATH: /var/data/su-order-api/orders.db
      ORDER_API_SLIPS_DIR: /var/data/su-order-api/slips
      ORDER_PREFIX: ${ORDER_PREFIX:-SU}
      ORDER_ROUND: ${ORDER_ROUND:-1}
      KHANTOKE_TICKET_QUOTA: ${KHANTOKE_TICKET_QUOTA:-2000}
      ORDER_API_TOKEN: ${ORDER_API_TOKEN:-}
      GOOGLE_SHEETS_WEBHOOK_URL: ${GOOGLE_SHEETS_WEBHOOK_URL:-}
      GOOGLE_SHEETS_WEBHOOK_TOKEN: ${GOOGLE_SHEETS_WEBHOOK_TOKEN:-}
      BYPASS_TOKEN: ${BYPASS_TOKEN:-}
      PICKUP_USERNAME: ${PICKUP_USERNAME:-staff}
      PICKUP_PASSWORD: ${PICKUP_PASSWORD:-}
    volumes:
      - /home/park/SU-STORE/data/order-api:/var/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

