services:
  order-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: su-order-api:local
    container_name: su-order-api
    restart: unless-stopped
    ports:
      - "3010:10000"
    environment:
      ORDER_API_HOST: 0.0.0.0
      ORDER_API_PORT: 10000
      ORDER_API_DB_PATH: /var/data/su-order-api/orders.db
      ORDER_API_SLIPS_DIR: /var/data/su-order-api/slips
      ORDER_PREFIX: FP28
      ORDER_ROUND: "1"
      KHANTOKE_TICKET_QUOTA: "2000"
      ORDER_API_TOKEN: ${ORDER_API_TOKEN:-}
      GOOGLE_SHEETS_WEBHOOK_URL: ${GOOGLE_SHEETS_WEBHOOK_URL:-}
      GOOGLE_SHEETS_WEBHOOK_TOKEN: ${GOOGLE_SHEETS_WEBHOOK_TOKEN:-}
    volumes:
      - order-api-data:/var/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  order-api-data:
